spring.application.name=refactorlab-api

# ===================== VERİTABANI (MySQL) =====================
# Farklı bilgisayarda kullanıcı/şifre farklıysa ortam değişkeni ile ezilebilir:
# DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/refactorlab?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}

# Tablolar entity'lere göre oluşturulur/güncellenir, veriler silinmez (kalıcı)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.refactorlab.api=info
# SQL loglarını görmek için açılabilir:
# logging.level.org.hibernate.SQL=debug

# ===================== ÖZEL UYGULAMA AYARI (@Value) =====================
# CodeSnippetServiceImpl constructor'ına @Value ile alınır
refactorlab.analysis.max-code-length=10000

# ===================== ACTUATOR =====================
management.endpoints.web.exposure.include=health,info,beans,mappings,metrics,env
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=RefactorLab API
info.app.description=Legacy kod ve SQL sorgularinda kod kokusu tespiti ve refactoring onerisi sunan REST API
info.app.version=1.0.0

# ===================== SWAGGER / OPENAPI =====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
